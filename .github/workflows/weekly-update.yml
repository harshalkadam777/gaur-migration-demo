name: Collect sightings
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-sightings
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pipeline before collection
        run: python -m unittest discover -s tests -v
      - name: Collect public source metadata
        id: collect
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Preserve records and status, including collection failures
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh candidates and collection status'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Upload recovery copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-records
          path: data/
          retention-days: 30
      - name: Mark unsuccessful collection as failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
